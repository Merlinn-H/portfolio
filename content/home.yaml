  - type: manifesto
    eyebrow:
      fr: Philosophie
      en: Philosophy
    title: {}
    intro:
      fr: >-
        Un bon tournage se joue bien avant le premier clap. Budget,
        planning, contrats, lieux, transports : je m'occupe de ce qui permet
        à une équipe de se concentrer sur le film. Quand la logistique
        tient, le plateau peut prendre des risques. Je l'ai fait sur des
        courts-métrages, des publicités et des documentaires, et je le fais
        aujourd'hui pour un jeu vidéo.
      en: >-
        A good shoot is decided long before the first take. Budgets,
        schedules, contracts, locations, travel: I handle what lets a crew
        focus on the film. When the logistics hold, the set can take risks.
        I've done it on short films, commercials and documentaries, and now
        on a video game.
    status: published
  - type: experience
    eyebrow:
      fr: Parcours
      en: Career
    title:
      fr: Expériences
      en: Experience
    intro:
      fr: >-
        Huit ans en production audiovisuelle, deux ans en production de jeu
        vidéo. Au quotidien : coordonner les équipes, tenir les budgets et
        les plannings, rédiger les contrats et monter les dossiers de
        financement.
      en: >-
        Eight years in audiovisual production, two in video game production.
        Day to day, I coordinate crews, keep budgets and schedules on track,
        draft contracts and put together funding applications.
    status: published
