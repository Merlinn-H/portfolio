body:
  fr: >-
    SynExplorer offre aux Êtres d'autres mondes une expérience virtuelle
    immersive : "Vibrez-la, Vivez-la." Un nouveau havre de paix, mais où les
    formes imaginées sont encore instables.


    Afin de rendre ces créations palpables, tangibles et stables, les opérateurs
    abaissent la fréquence de la simulation.


    C'est alors qu'une forme non-créée prend le contrôle total de SynExplorer.
  en: >-
    SynExplorer offers Beings from other worlds an immersive virtual experience:
    "Feel it, Live it." A new haven of peace, but where imagined forms are still
    unstable.


    To make these creations tangible and stable, operators lower the simulation
    frequency.


    That is when an uncreated form takes total control of SynExplorer.
